<style>
  :root{
    --paper:#E7EBF0;
    --panel:#F5F7FA;
    --ink:#101E2A;
    --muted:#5E7180;
    --rule:#C3CDD6;
    --rule-soft:#D9E0E7;
    --vowel:#A85D06;
    --cons:#0C6068;
    --address:#6600CC;
    --sans:Helvetica,"Helvetica Neue",Arial,"Liberation Sans",sans-serif;
    --display:Helvetica,"Helvetica Neue",Arial,"Liberation Sans",sans-serif;
    --mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .shell{max-width:640px;margin:0 auto;padding:32px 24px 72px}

  /* ---- minimal header ---- */
  .brand{
    font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);margin:0 0 22px;text-decoration:none;
    display:inline-block;
  }
  .brand:hover{color:var(--cons)}

  /* ---- inputs ---- */
  .field{margin-bottom:12px}
  .label{
    display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px;
  }
  .input{
    width:100%;background:var(--panel);color:var(--ink);
    border:1px solid var(--rule);border-radius:2px;padding:11px 13px;
    font-family:var(--mono);font-size:14px;line-height:1.5;
  }
  textarea.input{min-height:66px;resize:vertical}
  .input:focus{outline:2px solid var(--cons);outline-offset:2px;border-color:var(--cons)}
  .btn{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    background:none;border:1px solid var(--rule);border-radius:2px;color:var(--muted);
    padding:6px 12px;cursor:pointer;
  }
  .btn:hover{border-color:var(--cons);color:var(--cons)}
  .btn:focus-visible{outline:2px solid var(--cons);outline-offset:2px}
  .btn.primary{border-color:var(--cons);color:var(--cons)}
  .mini-btn{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    background:none;border:1px solid var(--rule-soft);border-radius:2px;color:var(--muted);
    padding:4px 9px;cursor:pointer;flex:1 1 0;
  }
  .mini-btn:hover{border-color:var(--cons);color:var(--cons)}
  .mini-btn:focus-visible{outline:2px solid var(--cons);outline-offset:2px}

  .lower-toggle{
    display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
    color:var(--muted);cursor:pointer;margin:10px 0 14px;
  }
  .lower-toggle input{accent-color:var(--cons);width:14px;height:14px;cursor:pointer}
  .lower-toggle.disabled{opacity:.4;cursor:default}

  .status{
    font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 4px;height:14px;
  }

  /* ---- the compact panel ---- */
  .panel-wrap{margin-bottom:14px;text-align:center}
  .panel-card{
    display:inline-block;border-radius:18px;overflow:hidden;
    box-shadow:0 1px 3px rgba(16,30,42,.08);max-width:100%;
  }
  .panel-card svg{display:block;max-width:100%;height:auto}
  .panel-actions{display:flex;justify-content:center;gap:8px;margin-top:12px}

  /* ---- detail section ---- */
  .detail{border-top:1px solid var(--rule);padding-top:30px;margin-top:44px}
  .detail-head{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0 0 20px;
  }
  .stage{width:min(380px,100%)}

  .icon-row{display:flex;gap:16px;margin-bottom:10px}
  .tile{flex:1 1 0;min-width:0}
  .tile.solo{flex:1 1 auto}
  .tile .frame{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden}
  .tile .frame svg{display:block;width:100%;height:100%}
  .tile-cap{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-top:8px;padding-top:6px;border-top:1px solid var(--rule-soft);
  }
  .tile-actions{display:flex;gap:6px;margin-top:6px}

  .name-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    margin-top:26px;
  }
  .name-value{
    font-family:var(--display);font-weight:700;letter-spacing:-.01em;
    font-size:clamp(28px,7vw,42px);line-height:1;
  }
  .name-value .v{color:var(--vowel)}
  .name-value .c{color:var(--cons)}
  .row-actions{display:flex;gap:6px;flex:0 0 auto}

  .address-row{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    margin-top:10px;padding-top:12px;border-top:1px solid var(--rule-soft);
  }
  .address{
    font-family:var(--mono);font-size:13px;color:var(--address);line-height:1.6;
    word-break:break-all;min-width:0;
  }

  /* ---- size previews (mirrors the workbench's "At size" boxes) ---- */
  .preview-group{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule-soft)}
  .preview-block{margin-bottom:22px}
  .preview-block:last-child{margin-bottom:0}
  .preview-row{position:relative;display:flex;align-items:flex-end;gap:10px}
  .preview-item{display:flex;flex-direction:column;align-items:center;gap:5px}
  .preview-box{overflow:hidden;flex:0 0 auto;border-radius:4px}
  .preview-box svg{display:block;width:100%;height:100%}
  .p64{width:64px;height:64px}
  .p32{width:32px;height:32px}
  .p16{width:16px;height:16px}
  .preview-size{font-family:var(--mono);font-size:9px;color:var(--muted)}
  /* positioned over the dead space above the 32/16 boxes (shorter than the
     64 box they're bottom-aligned with), rather than its own row, to keep
     the exported set compact */
  .preview-tag{
    position:absolute;top:0;left:74px;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);
  }
  .preview-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
  .preview-action-group{display:flex;align-items:center;gap:6px}
  .preview-action-sep{width:1px;align-self:stretch;background:var(--rule-soft);margin:0 2px}
  .preview-input{
    width:66px;background:var(--panel);color:var(--ink);
    border:1px solid var(--rule-soft);border-radius:2px;padding:4px 7px;
    font-family:var(--mono);font-size:11px;
  }
  .preview-input:focus{outline:2px solid var(--cons);outline-offset:1px;border-color:var(--cons)}
  .preview-actions .mini-btn{flex:0 0 auto}

  .flash{color:var(--cons) !important;border-color:var(--cons) !important}

  footer{
    margin-top:52px;padding-top:16px;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.9;
  }
  footer a{color:var(--muted)}
  footer a:hover{color:var(--cons)}

  @media (max-width:480px){
    .shell{padding:24px 16px 56px}
    .name-row,.address-row{flex-direction:column;align-items:flex-start}
    .row-actions{flex-direction:row}
  }
</style>
</head>
<body>
<div class="shell">

  <a class="brand" href="https://github.com/Stealth-R-D-LLC/stealthicons">Stealthicons</a>

  <div class="field">
    <label class="label" for="memo">Memo <span style="text-transform:none">(optional note — not part of the hash)</span></label>
    <input class="input" type="text" id="memo" spellcheck="false" placeholder="e.g. &quot;cold wallet&quot; — for your own reference">
  </div>
  <div class="field">
    <label class="label" for="src">Address or text</label>
    <textarea class="input" id="src" spellcheck="false" placeholder="paste an address, or type anything"></textarea>
  </div>
  <label class="lower-toggle" id="lowerToggleWrap">
    <input type="checkbox" id="lowerToggle"> Show the lowercase-enforced mark too
  </label>

  <p class="status" id="status"></p>

  <div class="panel-wrap" id="panelWrap">
    <div class="panel-card" id="panelCard"></div>
    <div class="panel-actions">
      <button class="btn primary" id="panelCopy" type="button">Copy image</button>
      <button class="btn primary" id="panelSave" type="button">Save image</button>
    </div>
  </div>

  <div class="detail" id="detail">
    <p class="detail-head">Individual pieces</p>
    <div class="stage">
      <div class="icon-row" id="iconRow"></div>

      <div class="name-row">
        <span class="name-value" id="nameText"></span>
        <div class="row-actions">
          <button class="btn" id="nameCopy" type="button">Copy</button>
          <button class="btn" id="nameSave" type="button">Save</button>
        </div>
      </div>

      <div class="address-row">
        <div class="address" id="addressText"></div>
        <div class="row-actions">
          <button class="btn" id="addrCopy" type="button">Copy</button>
          <button class="btn" id="addrSave" type="button">Save</button>
        </div>
      </div>

      <div class="preview-group" id="previewGroup"></div>
    </div>
  </div>

  <footer>
    <div>Every value here is a pure function of the text above — the same input always produces the
      same name and mark, and nothing you type leaves this page.</div>
    <div style="margin-top:8px">
      <a href="../demo/stealthicons.html">Full parameter workbench →</a>
    </div>
    <div style="margin-top:8px">
      <a href="https://github.com/Stealth-R-D-LLC/stealthicons">Source on GitHub →</a>
    </div>
  </footer>

</div>

<script src="../lib/stealthicons.js"></script>
<script>
(function(){
  "use strict";

  var el = {
    memo: document.getElementById("memo"),
    src: document.getElementById("src"),
    lowerToggleWrap: document.getElementById("lowerToggleWrap"),
    lowerToggle: document.getElementById("lowerToggle"),
    status: document.getElementById("status"),
    panelWrap: document.getElementById("panelWrap"),
    panelCard: document.getElementById("panelCard"),
    panelCopy: document.getElementById("panelCopy"),
    panelSave: document.getElementById("panelSave"),
    detail: document.getElementById("detail"),
    iconRow: document.getElementById("iconRow"),
    nameText: document.getElementById("nameText"),
    nameCopy: document.getElementById("nameCopy"),
    nameSave: document.getElementById("nameSave"),
    addressText: document.getElementById("addressText"),
    addrCopy: document.getElementById("addrCopy"),
    addrSave: document.getElementById("addrSave"),
    previewGroup: document.getElementById("previewGroup")
  };

  var SIZE = 8; // the official comparison size — this page isn't a workbench

  // ---- name markup (vowel/consonant coloured, matches the workbench) ----
  function nameMarkup(letters){
    return letters.map(function(L){
      return '<span class="' + (L.vowel ? "v" : "c") + '">' + L.ch + "</span>";
    }).join("");
  }

  function tileMarkup(id, label, svg){
    return '<figure class="tile" id="' + id + '">' +
      '<div class="frame">' + svg + "</div>" +
      '<div class="tile-cap">' + label + "</div>" +
      '<div class="tile-actions">' +
        '<button class="mini-btn" data-act="svg">SVG</button>' +
        '<button class="mini-btn" data-act="png">Copy</button>' +
      "</div>" +
    "</figure>";
  }

  // ---- size previews, same idea as the workbench's "At size" row: the same
  // mark, repeated into differently-sized boxes so CSS does the scaling ----
  function previewBlockMarkup(svg, label, id){
    return '<div class="preview-block" id="' + id + '">' +
      '<div class="preview-row">' +
        '<span class="preview-tag">' + label + "</span>" +
        '<div class="preview-item"><div class="preview-box p64">' + svg + '</div><span class="preview-size">64</span></div>' +
        '<div class="preview-item"><div class="preview-box p32">' + svg + '</div><span class="preview-size">32</span></div>' +
        '<div class="preview-item"><div class="preview-box p16">' + svg + '</div><span class="preview-size">16</span></div>' +
      "</div>" +
      '<div class="preview-actions">' +
        '<div class="preview-action-group">' +
          '<button class="mini-btn" data-act="copy-set">Copy Set</button>' +
          '<button class="mini-btn" data-act="save-set">Save Set</button>' +
        "</div>" +
        '<div class="preview-action-sep"></div>' +
        '<div class="preview-action-group">' +
          '<input class="preview-input" type="number" min="1" max="4096" placeholder="256">' +
          '<button class="mini-btn" data-act="copy-custom">Copy Size</button>' +
          '<button class="mini-btn" data-act="save-custom">Save Size</button>' +
        "</div>" +
      "</div>" +
    "</div>";
  }

  // Clicking again before the revert fires used to capture "Copied" itself
  // as the text to revert to (each call just read the button's *current*
  // label), so the stale second timeout could leave it stuck reading
  // "Copied" forever. Cancelling any pending timer and only ever capturing
  // the true original label once (on the first call, not the second) fixes
  // that regardless of how many times the button is clicked in a row.
  function flash(btn, word){
    if (btn._flashTimer){
      clearTimeout(btn._flashTimer);
    } else {
      btn._flashOriginal = btn.textContent;
    }
    btn.textContent = word;
    btn.classList.add("flash");
    btn._flashTimer = setTimeout(function(){
      btn.textContent = btn._flashOriginal;
      btn.classList.remove("flash");
      btn._flashTimer = null;
    }, 1400);
  }

  function download(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function copyText(text, btn){
    navigator.clipboard.writeText(text).then(
      function(){ flash(btn, "Copied"); },
      function(){ flash(btn, "Failed"); }
    );
  }

  function svgToPngBlob(svg, w, h){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error("toBlob failed")); }, "image/png");
      };
      img.onerror = function(){ reject(new Error("image load failed")); };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });
  }

  function wireTileButtons(root, svg, label){
    root.addEventListener("click", function(ev){
      var btn = ev.target.closest ? ev.target.closest(".mini-btn") : null;
      if (!btn) return;
      var sized = Stealthicons.svgAtSize(svg, 512);
      if (btn.getAttribute("data-act") === "svg"){
        download(new Blob([sized], { type: "image/svg+xml;charset=utf-8" }), "stealthicon-" + label + ".svg");
        flash(btn, "Saved");
        return;
      }
      svgToPngBlob(sized, 512, 512).then(function(blob){
        if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
          return navigator.clipboard.write([new window.ClipboardItem({ "image/png": blob })])
            .then(function(){ flash(btn, "Copied"); },
                  function(){ download(blob, "stealthicon-" + label + ".png"); flash(btn, "Saved"); });
        }
        download(blob, "stealthicon-" + label + ".png");
        flash(btn, "Saved");
      }).catch(function(){ flash(btn, "Failed"); });
    });
  }

  function pngCopyOrSave(svg, size, filename, btn, forceSave){
    var sized = Stealthicons.svgAtSize(svg, size);
    svgToPngBlob(sized, size, size).then(function(blob){
      if (!forceSave && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
        return navigator.clipboard.write([new window.ClipboardItem({ "image/png": blob })])
          .then(function(){ flash(btn, "Copied"); },
                function(){ download(blob, filename); flash(btn, "Saved"); });
      }
      download(blob, filename);
      flash(btn, "Saved");
    }).catch(function(){ flash(btn, "Failed"); });
  }

  // The whole 64/32/16 set, flattened into one image with its size labels
  // and the ORIGINAL/LOWERCASE tag -- same idea as the compact card, so
  // Copy Set/Save Set hand over exactly what's shown on the page.
  function buildPreviewSetSvg(svg, label){
    var PAD = 14, GAP = 10, LABEL_GAP = 5, LABEL_SIZE = 9;
    var x64 = PAD, x32 = x64 + 64 + GAP, x16 = x32 + 32 + GAP;
    var yBottom = PAD + 64;
    var labelY = yBottom + LABEL_GAP;
    var W = Math.round(x16 + 16 + PAD);
    var H = Math.round(labelY + LABEL_SIZE * 1.3 + PAD);

    var parts = [];
    parts.push(svgText(x32, PAD, label.toUpperCase(), { size: 10, color: PCOLOR.muted, spacing: 1, anchor: "start", hanging: true }));
    parts.push(embedIconSvg(svg, x64, PAD, 64));
    parts.push(embedIconSvg(svg, x32, yBottom - 32, 32));
    parts.push(embedIconSvg(svg, x16, yBottom - 16, 16));
    [[x64, 64], [x32, 32], [x16, 16]].forEach(function(entry){
      parts.push(svgText(entry[0] + entry[1] / 2, labelY, String(entry[1]), { size: LABEL_SIZE, color: PCOLOR.muted, hanging: true }));
    });

    return {
      svg: '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img">' +
        '<rect width="' + W + '" height="' + H + '" rx="10" fill="' + PCOLOR.panelBg + '"/>' + parts.join("") + "</svg>",
      width: W, height: H
    };
  }

  // Copy Set/Save Set export the whole 64/32/16 row as one image; the
  // custom-size controls render the mark alone at whatever size is typed.
  function wirePreviewBlock(root, svg, label){
    var input = root.querySelector(".preview-input");
    root.addEventListener("click", function(ev){
      var btn = ev.target.closest ? ev.target.closest(".mini-btn") : null;
      if (!btn) return;
      var act = btn.getAttribute("data-act");
      if (act === "copy-set" || act === "save-set"){
        // 1:1 with the SVG's own declared width/height -- the whole point of
        // labeling the boxes 64/32/16 is that those are honest pixel counts
        // in the exported file, matching the card export and the custom-size
        // export (verified against the raw PNG header) elsewhere on this page.
        var built = buildPreviewSetSvg(svg, label);
        svgToPngBlob(built.svg, built.width, built.height).then(function(blob){
          var filename = "stealthicon-" + label + "-set.png";
          if (act === "copy-set" && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
            return navigator.clipboard.write([new window.ClipboardItem({ "image/png": blob })])
              .then(function(){ flash(btn, "Copied"); },
                    function(){ download(blob, filename); flash(btn, "Saved"); });
          }
          download(blob, filename);
          flash(btn, "Saved");
        }).catch(function(){ flash(btn, "Failed"); });
      } else if (act === "copy-custom" || act === "save-custom"){
        var size = Math.round(parseFloat(input.value));
        if (!isFinite(size) || size < 1) size = 256;
        size = Math.min(4096, Math.max(1, size));
        input.value = size;
        pngCopyOrSave(svg, size, "stealthicon-" + label + "-" + size + ".png", btn, act === "save-custom");
      }
    });
  }

  // ---- compact panel: a single flattened SVG combining memo, mark(s), name
  // and address, so it can be copied/saved as one image (replacing a manual
  // screen capture). What's on screen is exactly what gets exported. Both
  // dimensions are sized to content (driven by the icon row's width) rather
  // than a fixed canvas, so the card stays portrait and free of dead space;
  // rasterized 1:1, so the exported PNG's pixel size matches what's drawn.
  var PCOLOR = {
    panelBg: "#F5F7FA", ink: "#101E2A", muted: "#5E7180",
    rule: "#C3CDD6", address: "#6600CC"
  };
  var PMONO = "ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace";
  var PDISPLAY = "Helvetica,'Helvetica Neue',Arial,'Liberation Sans',sans-serif";

  function escapeXml(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function svgText(x, y, str, opts){
    opts = opts || {};
    var attrs = 'x="' + x + '" y="' + y + '" text-anchor="' + (opts.anchor || "middle") + '" ' +
      'font-family="' + (opts.family || PMONO) + '" font-size="' + (opts.size || 13) + '" ' +
      'font-weight="' + (opts.weight || 400) + '" fill="' + (opts.color || PCOLOR.ink) + '"';
    if (opts.spacing) attrs += ' letter-spacing="' + opts.spacing + '"';
    if (opts.hanging) attrs += ' dominant-baseline="hanging"';
    return "<text " + attrs + ">" + escapeXml(str) + "</text>";
  }

  // The name is coloured with the darkest of its own mark's dot colours (not
  // the fixed vowel/consonant colours used elsewhere on the page), so it
  // reads as belonging to that specific mark. No background swatch -- a
  // solid colour on the card's own background is legible enough on its own
  // and keeps the card from visually fusing the name into whatever's above it.
  function darkestColor(paletteList){
    var candidates = [paletteList[1], paletteList[2], paletteList[3]].filter(Boolean);
    var best = candidates[0], bestLum = Stealthicons.luminance(best);
    candidates.forEach(function(c){
      var l = Stealthicons.luminance(c);
      if (l < bestLum){ bestLum = l; best = c; }
    });
    // Even the darkest dot colour is sometimes still too light against the
    // card's own background to read well. When that happens, fall back to
    // the mark's background colour instead -- since the palette keeps
    // background-vs-dots contrast up, a mark with light dots reliably has a
    // dark background to begin with.
    if (Stealthicons.contrast(best, PCOLOR.panelBg) < 4.5) best = paletteList[0];
    return best;
  }

  // dominant-baseline="hanging" anchors text by its top edge rather than its
  // (font-metric-dependent) baseline, so gaps can be set directly with no
  // ascent guesswork.
  function svgNameText(x, yTop, letters, size, color){
    var text = letters.map(function(L){ return L.ch; }).join("");
    return '<text x="' + x + '" y="' + yTop + '" text-anchor="middle" dominant-baseline="hanging" font-family="' + PDISPLAY + '" ' +
      'font-weight="700" font-size="' + size + '" letter-spacing="-1" fill="' + color + '">' + escapeXml(text) + "</text>";
  }

  function embedIconSvg(svg, x, y, size){
    var vb = (svg.match(/viewBox="([^"]+)"/) || [null, "0 0 8 8"])[1];
    var inner = svg.replace(/^<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
    return '<svg x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" viewBox="' + vb + '">' + inner + "</svg>";
  }

  function wrapMonospace(str, maxWidth, fontSize, maxLines){
    var charW = fontSize * 0.62;
    var perLine = Math.max(4, Math.floor(maxWidth / charW));
    var lines = [];
    for (var i = 0; i < str.length && (!maxLines || lines.length < maxLines); i += perLine){
      lines.push(str.slice(i, i + perLine));
    }
    if (maxLines && str.length > perLine * maxLines){
      var last = lines[lines.length - 1];
      lines[lines.length - 1] = last.slice(0, Math.max(0, last.length - 1)) + "…";
    }
    return lines.length ? lines : [""];
  }

  var GAP_STD = 8, GAP_MEMO = 3.2, GAP_LABEL = 6, GAP_NAME_ADDR = 16;
  var PAD_V = 18, PAD_TOP = 18 * 1.15; // memo gets ~15% more room above it than the bottom gets
  var MEMO_SIZE = 18.375, ADDR_SIZE = 14.625; // (14 x1.25 x1.05) and (13 x1.25 x0.9)
  var CARD_MAX_W = 285;
  var ADDR_MAX_W = 225;

  // Real glyph measurement (canvas), not a character-count guess -- used to
  // decide how wide the card should get and to confirm the memo actually
  // fits on one line at that width, so the two never disagree.
  var measureCanvas = null;
  function measureTextWidth(text, fontSize, fontFamily, weight){
    if (!measureCanvas) measureCanvas = document.createElement("canvas");
    var ctx = measureCanvas.getContext("2d");
    ctx.font = (weight || 400) + " " + fontSize + "px " + fontFamily;
    return ctx.measureText(text).width;
  }

  // Word-wrap driven by the same real measurement used to size the card, so
  // a wrapped memo actually fills each line's available width the way the
  // (monospace, so already close to this) address text does, rather than
  // wrapping early the way a character-count guess would. No line cap --
  // a long memo just wraps to as many lines as it needs, growing the card.
  function wrapByMeasure(text, maxWidth, fontSize, fontFamily, weight){
    var words = text.split(/\s+/).filter(Boolean);
    if (!words.length) return [""];
    var lines = [];
    var current = words[0];
    for (var i = 1; i < words.length; i++){
      var candidate = current + " " + words[i];
      if (measureTextWidth(candidate, fontSize, fontFamily, weight) <= maxWidth){
        current = candidate;
        continue;
      }
      lines.push(current);
      current = words[i];
      // a single word wider than the line: hard-break it by characters
      while (measureTextWidth(current, fontSize, fontFamily, weight) > maxWidth && current.length > 1){
        var fit = current;
        while (fit.length > 1 && measureTextWidth(fit, fontSize, fontFamily, weight) > maxWidth) fit = fit.slice(0, -1);
        if (fit.length === current.length) break;
        lines.push(fit);
        current = current.slice(fit.length);
      }
    }
    lines.push(current);
    return lines;
  }

  function buildPanelSvg(state){
    var PAD = 16;
    var twoUp = state.showBoth && state.lowerSvg;
    var iconSize = twoUp ? 104 : 176;
    var iconGap = 10;
    var iconRowW = twoUp ? (iconSize * 2 + iconGap) : iconSize;

    // The card widens (up to CARD_MAX_W) to fit the memo on one line if it
    // can; the icon row and address just inherit whatever width results.
    // Rounds UP (not to nearest) so contentW is never a hair narrower than
    // the real measured memo width -- rounding to nearest was occasionally
    // shaving off a fraction of a pixel, just enough to fail the "fits on
    // one line" check below and wrap text that visibly had room to spare.
    var contentW = iconRowW;
    if (state.memo){
      var memoW = measureTextWidth(state.memo, MEMO_SIZE, PDISPLAY, 700);
      contentW = Math.max(contentW, Math.min(memoW, CARD_MAX_W - PAD * 2));
    }
    var W = Math.min(CARD_MAX_W, Math.ceil(contentW + PAD * 2));
    contentW = W - PAD * 2;
    var iconsX = (W - iconRowW) / 2;

    // both memo and the footer are top-anchored (dominant-baseline="hanging")
    // so their padding is exact instead of guessed from font-metric ascent.
    var y = PAD_TOP;
    var parts = [];

    if (state.memo){
      var memoLines = measureTextWidth(state.memo, MEMO_SIZE, PDISPLAY, 700) <= contentW + 0.5
        ? [state.memo]
        : wrapByMeasure(state.memo, contentW, MEMO_SIZE, PDISPLAY, 700);
      memoLines.forEach(function(line){
        parts.push(svgText(W / 2, y, line, { size: MEMO_SIZE, color: PCOLOR.ink, family: PDISPLAY, weight: 700, hanging: true }));
        y += 22;
      });
      y += GAP_MEMO;
    }

    if (twoUp){
      var xLeft = iconsX, xRight = iconsX + iconSize + iconGap;
      parts.push(svgText(xLeft + iconSize / 2, y, "ORIGINAL", { size: 8, color: PCOLOR.muted, spacing: 0.5, hanging: true }));
      parts.push(svgText(xRight + iconSize / 2, y, "LOWERCASE", { size: 8, color: PCOLOR.muted, spacing: 0.5, hanging: true }));
      y += 8 + GAP_LABEL;
      parts.push(embedIconSvg(state.origSvg, xLeft, y, iconSize));
      parts.push(embedIconSvg(state.lowerSvg, xRight, y, iconSize));
      y += iconSize + GAP_STD;
    } else {
      parts.push(embedIconSvg(state.origSvg, iconsX, y, iconSize));
      y += iconSize + GAP_STD;
    }

    var NAME_SIZE = 30;
    parts.push(svgNameText(W / 2, y, state.letters, NAME_SIZE, darkestColor(state.paletteList)));
    y += NAME_SIZE * 1.2 + GAP_NAME_ADDR;

    if (state.address){
      wrapMonospace(state.address, Math.min(contentW, ADDR_MAX_W), ADDR_SIZE, 6).forEach(function(line){
        parts.push(svgText(W / 2, y, line, { size: ADDR_SIZE, color: PCOLOR.address, family: PMONO }));
        y += 19;
      });
    }
    y += GAP_STD;

    parts.push(svgText(W / 2, y, "STEALTHICONS by StealthSend", { size: 8, color: PCOLOR.muted, weight: 600, spacing: 0.5, hanging: true }));
    y += 10 + PAD_V;

    var H = Math.round(y);
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img">' +
      '<rect width="' + W + '" height="' + H + '" rx="16" fill="' + PCOLOR.panelBg + '"/>' +
      '<rect x="0.5" y="0.5" width="' + (W - 1) + '" height="' + (H - 1) + '" rx="15.5" fill="none" stroke="' + PCOLOR.rule + '"/>' +
      parts.join("") + "</svg>";
  }

  var currentPanelSvg = null;

  function renderPanel(origMark, lowerMark, showBoth, letters, memo, address){
    currentPanelSvg = buildPanelSvg({
      origSvg: origMark.svg,
      lowerSvg: lowerMark ? lowerMark.svg : null,
      showBoth: showBoth,
      letters: letters,
      paletteList: origMark.palette.list,
      memo: memo,
      address: address
    });
    el.panelCard.innerHTML = currentPanelSvg;
  }

  function panelPngBlob(){
    var m = currentPanelSvg.match(/viewBox="0 0 (\d+) (\d+)"/);
    var w = +m[1], h = +m[2];
    return svgToPngBlob(currentPanelSvg, w, h);
  }

  el.panelCopy.addEventListener("click", function(){
    if (!currentPanelSvg) return;
    panelPngBlob().then(function(blob){
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
        return navigator.clipboard.write([new window.ClipboardItem({ "image/png": blob })])
          .then(function(){ flash(el.panelCopy, "Copied"); },
                function(){ download(blob, "stealthicons-card.png"); flash(el.panelCopy, "Saved"); });
      }
      download(blob, "stealthicons-card.png");
      flash(el.panelCopy, "Saved");
    }).catch(function(){ flash(el.panelCopy, "Failed"); });
  });

  el.panelSave.addEventListener("click", function(){
    if (!currentPanelSvg) return;
    panelPngBlob().then(function(blob){
      download(blob, "stealthicons-card.png");
      flash(el.panelSave, "Saved");
    }).catch(function(){ flash(el.panelSave, "Failed"); });
  });

  // ---- main render ----
  var run = 0;

  function render(text){
    var myRun = ++run;
    el.status.textContent = "Computing…";

    var lowerText = text.toLowerCase();
    var needsLower = lowerText !== text;
    var showBoth = needsLower && el.lowerToggle.checked;

    Promise.all([
      Stealthicons.stealthicon(text),
      showBoth ? Stealthicons.stealthicon(lowerText) : null
    ]).then(function(results){
      if (myRun !== run) return; // a newer keystroke has already superseded this
      var orig = results[0], lower = results[1];
      var origMark = orig.mark(SIZE);
      var lowerMark = lower ? lower.mark(SIZE) : null;

      el.status.textContent = "";
      el.lowerToggle.disabled = !needsLower;
      el.lowerToggleWrap.classList.toggle("disabled", !needsLower);

      // ---- icon row ----
      el.iconRow.innerHTML =
        tileMarkup("tileOriginal", "Original", origMark.svg) +
        (showBoth && lowerMark ? tileMarkup("tileLower", "Lowercase", lowerMark.svg) : "");
      if (!showBoth || !lowerMark) el.iconRow.querySelector(".tile").classList.add("solo");
      wireTileButtons(document.getElementById("tileOriginal"), origMark.svg, "original");
      if (showBoth && lowerMark) wireTileButtons(document.getElementById("tileLower"), lowerMark.svg, "lowercase");

      // ---- name ----
      el.nameText.innerHTML = nameMarkup(orig.letters);

      // ---- address ----
      el.addressText.textContent = text;

      // ---- size previews ----
      el.previewGroup.innerHTML =
        previewBlockMarkup(origMark.svg, "Original", "previewOriginal") +
        (showBoth && lowerMark ? previewBlockMarkup(lowerMark.svg, "Lowercase", "previewLower") : "");
      wirePreviewBlock(document.getElementById("previewOriginal"), origMark.svg, "original");
      if (showBoth && lowerMark) wirePreviewBlock(document.getElementById("previewLower"), lowerMark.svg, "lowercase");

      // ---- compact panel ----
      renderPanel(origMark, lowerMark, showBoth, orig.letters, el.memo.value.trim(), text);
    }).catch(function(err){
      if (myRun !== run) return;
      el.status.textContent = "Couldn't compute a stealthicon for that text.";
      console.error(err);
    });
  }

  var typing = null;
  function scheduleRender(){
    clearTimeout(typing);
    typing = setTimeout(function(){ render(el.src.value); }, 250);
  }

  // Auto-check only fires on the transition from no-uppercase to
  // has-uppercase -- once the text already has uppercase, further edits
  // (including a user unchecking the box) leave it alone, so turning it off
  // sticks instead of being clobbered by the next keystroke.
  var prevHasUpper = false;
  el.src.addEventListener("input", function(){
    var hasUpper = /[A-Z]/.test(el.src.value);
    if (hasUpper && !prevHasUpper) el.lowerToggle.checked = true;
    prevHasUpper = hasUpper;
    scheduleRender();
  });
  el.memo.addEventListener("input", scheduleRender);
  el.lowerToggle.addEventListener("change", function(){ render(el.src.value); });

  el.nameCopy.addEventListener("click", function(){ copyText(el.nameText.textContent, el.nameCopy); });
  el.nameSave.addEventListener("click", function(){
    download(new Blob([el.nameText.textContent], { type: "text/plain;charset=utf-8" }), "stealthicon-name.txt");
    flash(el.nameSave, "Saved");
  });
  el.addrCopy.addEventListener("click", function(){ copyText(el.addressText.textContent, el.addrCopy); });
  el.addrSave.addEventListener("click", function(){
    download(new Blob([el.addressText.textContent], { type: "text/plain;charset=utf-8" }), "address.txt");
    flash(el.addrSave, "Saved");
  });

  // Compute immediately, even for the empty string — it's still valid input
  // (matches identicon.stealth.org, which never shows a "waiting" state).
  render(el.src.value);
})();
</script>
</body>
</html>
